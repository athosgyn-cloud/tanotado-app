<style>
/* Layout: barra de controles do protótipo no topo; abaixo, o app numa moldura de celular (barra inferior com "+" central) ou de navegador (menu lateral). */
:root{
  --page:#E6ECE9; --bg:#FFFFFF; --soft:#F4F7F5; --card:#FFFFFF; --fg:#121A17; --muted:#6A7873; --line:#EEF2F0; --line2:#DFE6E2;
  --g1:#0A4F3D; --g2:#0E7A5B; --link:#0E7A5B; --amber:#F2A516; --amber-soft:#FFF4DC; --amber-ink:#7A5208;
  --good:#1E8A4C; --good-soft:#E3F5EA; --bad:#D2452F; --bad-soft:#FDECE8; --warn:#B7791F; --t-flat:#2F6DB5;
  --chat-bg:#EFEAE2; --bubble-in:#FFFFFF; --bubble-out:#D9FDD3;
  --shadow:0 1px 2px rgba(16,32,28,.05),0 6px 20px rgba(16,32,28,.06);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#070B0A;--bg:#0E1513;--soft:#151E1B;--card:#172220;--fg:#ECF2EF;--muted:#9AA9A3;--line:#22302B;--line2:#2C3B35;--link:#4CCB9C;
  --amber-soft:#3A2C0D;--amber-ink:#F7CF7A;--good:#4CC27F;--good-soft:#16301F;--bad:#F07A64;--bad-soft:#3A1A14;--warn:#E3A84A;--t-flat:#6EA6EA;
  --chat-bg:#0B1411;--bubble-in:#1E2925;--bubble-out:#1F4A35;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#070B0A;--bg:#0E1513;--soft:#151E1B;--card:#172220;--fg:#ECF2EF;--muted:#9AA9A3;--line:#22302B;--line2:#2C3B35;--link:#4CCB9C;
  --amber-soft:#3A2C0D;--amber-ink:#F7CF7A;--good:#4CC27F;--good-soft:#16301F;--bad:#F07A64;--bad-soft:#3A1A14;--warn:#E3A84A;--t-flat:#6EA6EA;
  --chat-bg:#0B1411;--bubble-in:#1E2925;--bubble-out:#1F4A35;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 32px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,.press:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Barra do protótipo */
.proto{max-width:1180px;margin:0 auto 18px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.proto h1{font-family:var(--display);font-size:21px;margin:0;font-weight:800;letter-spacing:-.02em}
.proto h1 small{display:block;font-family:var(--body);font-size:12.5px;font-weight:500;color:var(--muted);letter-spacing:0}
.ctrls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.grp{display:flex;align-items:center;gap:6px}
.grp>span{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-right:2px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.note{max-width:1180px;margin:16px auto 0;font-size:13px;color:var(--muted);text-align:center}
.note b{color:var(--fg)}

/* Palco */
.stage{max-width:1180px;margin:0 auto;display:flex;justify-content:center}
.phone{width:390px;max-width:100%;height:min(820px, calc(100vh - 120px));min-height:640px;border-radius:44px;padding:10px;background:#0B0F0E;box-shadow:0 30px 60px rgba(0,0,0,.18)}
.browser{width:100%;border-radius:14px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.14);border:1px solid var(--line2);background:var(--bg)}
.browser .bbar{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--soft);border-bottom:1px solid var(--line)}
.browser .bbar i{width:10px;height:10px;border-radius:50%;background:var(--line2)}
.browser .bbar .url{flex:1;margin-left:10px;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:4px 10px;font-size:12px;color:var(--muted);max-width:380px}
.apphost{position:relative;height:100%;overflow:hidden}
.phone .apphost{border-radius:35px}

/* App */
.app{background:var(--bg);color:var(--fg);height:100%;position:relative}
.app.m{display:flex;flex-direction:column}
.app.d{display:grid;grid-template-columns:236px 1fr;height:780px}
.scroll{overflow-y:auto;display:flex;flex-direction:column;gap:16px;min-height:0;flex:1;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.app.m .scroll{padding:18px 18px 112px}
.app.m .scroll.chatmode{padding:0}
.app.d .scroll{padding:28px 32px 34px;background:var(--soft)}
.scroll>*{flex-shrink:0}

/* Efeitos de toque */
.press,button{transition:transform .14s ease,background-color .2s,box-shadow .2s}
.press:active,button:active:not(:disabled){transform:scale(.97)}
.press{cursor:pointer;user-select:none}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(3);opacity:0}}

/* Entrada animada (só quando troca de tela) */
.anim .scroll>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.anim .scroll>*:nth-child(2){animation-delay:.04s}.anim .scroll>*:nth-child(3){animation-delay:.08s}.anim .scroll>*:nth-child(4){animation-delay:.12s}.anim .scroll>*:nth-child(5){animation-delay:.16s}.anim .scroll>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.anim .bar i,.anim .meter i,.anim .split b,.anim .dbar b{animation:grow 1.05s .15s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{width:0}}
.anim .ring .rv{animation:ringIn 1.2s .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringIn{from{stroke-dashoffset:var(--full)}}

/* Topo (celular) */
.top{display:flex;align-items:center;gap:10px}
.hi{flex:1;min-width:0}.hi b{display:block;font-size:15px}
.hi button{border:0;background:none;padding:0;font-size:12.5px;color:var(--muted);font-weight:500}
.hi button u{text-decoration:none;color:var(--link);font-weight:700}
.icb{width:40px;height:40px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;border:0;color:var(--fg);position:relative;flex:none}
.icb svg{width:20px;height:20px}
.icb.wa{color:#1FA855}
.icb .dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:#F0563A;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--soft)}
.avs{display:flex;flex:none}.avs .wav+.wav{margin-left:-12px}
.wav{width:var(--s);height:var(--s);border-radius:50%;background:linear-gradient(160deg, color-mix(in srgb, var(--c) 55%, #fff), var(--c));display:inline-block;overflow:hidden;flex:none;vertical-align:middle;box-shadow:0 0 0 2px var(--bg)}
.wav svg{width:100%;height:100%;display:block}

/* Títulos */
h2.page{font-family:var(--display);font-size:22px;margin:0;letter-spacing:-.02em;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);font-size:13.5px;margin:3px 0 0}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:4px 0 -6px}
.sh b{font-weight:700;font-size:16px}
.sh button,.linkbtn{border:0;background:none;padding:0;font-size:13px;color:var(--link);font-weight:700}

/* Cartões */
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.app.d .card{box-shadow:0 1px 2px rgba(16,32,28,.04)}
.card h3{margin:0 0 10px;font-size:15px;font-weight:700}
.cols{display:grid;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.app.d .cols{grid-template-columns:1.15fr 1fr}
.app.d .cols.even{grid-template-columns:1fr 1fr}
.app.m .cols{display:flex;flex-direction:column;align-items:stretch}

/* Hero */
.hero{position:relative;border-radius:28px;padding:20px;color:#fff;overflow:hidden;background:radial-gradient(110% 80% at 100% 0%,rgba(242,165,22,.22) 0%,rgba(242,165,22,0) 50%),linear-gradient(150deg,#13805F 0%,var(--g1) 75%);box-shadow:0 14px 30px rgba(10,79,61,.30)}
.anim .hero:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%);transform:translateX(-120%);animation:shine 2.4s .5s ease-out 1 forwards;pointer-events:none}
@keyframes shine{to{transform:translateX(120%)}}
.hero .l{font-size:13px;opacity:.9;display:flex;justify-content:space-between;align-items:center}
.hero .l .lt{background:none;padding:0;font-size:13px;font-weight:400;border-radius:0;display:flex;align-items:center;gap:6px}
.eye{background:rgba(255,255,255,.14);border:0;color:inherit;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;padding:0}.eye svg{width:17px;height:17px}
.hero .l span:not(.lt){background:rgba(255,255,255,.16);padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600}
.hero .v{font-family:var(--display);font-weight:700;font-size:32px;letter-spacing:-.025em;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.1}
.hero .v small{font-size:18px;opacity:.7}
.meter{height:8px;border-radius:9px;background:rgba(255,255,255,.2);margin-top:14px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#FFD36B,var(--amber))}
.flow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.fi{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.12);border:0;border-radius:15px;padding:9px 10px;color:#fff;text-align:left;min-width:0}
.fi i{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-style:normal}
.fi i svg{width:15px;height:15px}
.fi.in i{background:#4ADE9A;color:#073B2C}.fi.out i{background:#FFB4A3;color:#5A1607}
.fi span{display:block;font-size:11.5px;opacity:.82}.fi b{font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hero .meter{margin-top:12px;background:rgba(74,222,154,.35)}
.hero .ml{display:flex;justify-content:space-between;font-size:11.5px;opacity:.85;margin-top:6px}
.after{display:flex;align-items:center;gap:10px;width:100%;margin-top:14px;border:0;background:rgba(255,255,255,.12);border-radius:16px;color:#fff;padding:11px 12px;text-align:left}
.after .al{flex:1;min-width:0}.after .al b{display:block;font-size:14px}.after .al span{display:block;font-size:11.5px;opacity:.8;line-height:1.3;margin-top:1px}
.after .ar{text-align:right;flex:none}.after .ar b{display:block;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap;color:#FFD36B}.after .ar span{display:block;font-size:11px;opacity:.8;white-space:nowrap}
.after .chv{font-style:normal;font-size:18px;opacity:.7}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow);border:0;text-align:left;min-width:0}
.stat span{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted)}
.stat span i{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal}
.stat span i svg{width:10px;height:10px}
.stat b{display:block;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.in b{color:var(--good)}.stat.in i{background:var(--good-soft);color:var(--good)}.stat.out i{background:var(--bad-soft);color:var(--bad)}
.stat.sal{background:linear-gradient(150deg,#13805F,var(--g1));color:#fff}.stat.sal span{color:rgba(255,255,255,.8)}
.hb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.hb>*{background:rgba(255,255,255,.12);border-radius:15px;padding:9px 11px;border:0;color:#fff;text-align:left;min-width:0}
.hb span{display:block;font-size:11.5px;opacity:.82}.hb b{font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Avisos e dicas */
.ins{display:flex;gap:12px;align-items:center;background:var(--amber-soft);border-radius:20px;padding:13px 14px;border:0;text-align:left;width:100%}
.ins .ic{width:40px;height:40px;border-radius:13px;background:var(--card);color:var(--amber-ink);display:flex;align-items:center;justify-content:center;flex:none}.ins .ic svg{width:21px;height:21px}
.ins b{font-size:14px;display:block}.ins span{font-size:12.5px;color:var(--amber-ink)}
.ins.bad{background:var(--bad-soft)}.ins.bad .ic{background:var(--card);color:var(--bad)}.ins.bad span{color:var(--bad)}
.ins.good{background:var(--good-soft)}.ins.good .ic{background:var(--card);color:var(--good)}.ins.good span{color:var(--good)}

/* Ícones de categoria */
.tile{--c:#7A8580;width:40px;height:40px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;flex:none;line-height:1;background:color-mix(in srgb,var(--c) 15%,var(--card));color:var(--c)}
.rev h3{margin-bottom:2px}.rev .list{margin-top:8px}.rev .it{flex-wrap:wrap;row-gap:8px}.revb{display:flex;gap:6px;width:100%;padding-left:52px}.rev .it .t{min-width:0;flex:1}
.pace .pt{margin:2px 0 6px;font-size:14px}.pace .pt b{font-size:16px}.pc{width:100%;height:auto;display:block}.pace .lg{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px}.pace .lg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}.pace .lg i.ds{background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 7px);opacity:.7}
.dn{display:flex;align-items:center;gap:16px}.dn svg{width:132px;height:132px;flex:none}.dn .dt{font-size:10px;fill:var(--muted)}.dn .dv{font-size:13px;font-weight:700;fill:var(--fg)}.dl{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}.dl button{display:flex;align-items:center;gap:8px;background:none;border:0;padding:5px 0;font:inherit;font-size:13.5px;color:var(--fg);text-align:left}.dl i{width:10px;height:10px;border-radius:3px;flex:none}.dl span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.promise ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.tseg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.tseg button{border:0;background:none;border-radius:11px;padding:9px;font-weight:700;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}.tseg svg{width:16px;height:16px}
.tseg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tseg button[data-atipo="out"][aria-pressed="true"] svg{color:var(--bad)}.tseg button[data-atipo="in"][aria-pressed="true"] svg{color:var(--good)}
.amt{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:6px 0 2px;cursor:text}
.amt span{font-size:20px;font-weight:700;color:var(--muted)}
.sheet .amt input{border:0;background:none;border-radius:0;outline:none;font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:-.02em;width:6.2ch;color:var(--fg);padding:0;text-align:left;font-variant-numeric:tabular-nums}
.sheet .amt input::placeholder{color:var(--line2)}.sheet .amt.in input{color:var(--good)}.amt{border-bottom:2px solid var(--line);margin:0 30px}.amt:focus-within{border-color:var(--g2)}
.amt.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.adesc{border:1.5px solid var(--line2)!important;background:var(--soft);border-radius:14px;padding:12px 14px;font:inherit;font-size:15px;color:var(--fg);outline:none;width:100%}
.adesc:focus{border-color:var(--g2)!important}
.fl small{text-transform:none;letter-spacing:0;font-weight:500;margin-left:6px}
.acats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px 4px}
.acats button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:14px;font-size:11.5px;font-weight:600;color:var(--muted);min-width:0}
.acats button span:not(.tile){max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acats button[aria-pressed="true"]{background:color-mix(in srgb,var(--g2) 10%,var(--bg));color:var(--fg)}
.acats button[aria-pressed="true"] .tile{box-shadow:0 0 0 2px var(--g2)}
.arow{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.arow .fl{margin:0 2px 0 0;width:40px}
.arow button{border:1px solid var(--line2);background:var(--bg);border-radius:999px;padding:6px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.arow button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.or{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin-top:2px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line2)}
.inrow.fast input{font-size:14.5px;padding:11px 13px}.inrow.fast .send{width:46px}
.ib{width:44px;border:1.5px solid var(--line2);background:var(--soft);border-radius:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none;padding:0}.ib svg{width:20px;height:20px}
.exrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.exrow span{font-size:12px;color:var(--muted);margin-right:2px}
.exrow button{border:0;background:var(--soft);border-radius:999px;padding:7px 12px;font-size:13px}
.brk{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:2px 0 3px}.brk i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.insrow{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -18px;padding:0 18px}.insrow::-webkit-scrollbar{display:none}.insrow>*{flex:0 0 88%;scroll-snap-align:start}
.app.d .insrow{margin:0;padding:0;flex-direction:column}.app.d .insrow>*{flex:none}
.cat3 .p small{font-size:11px;font-weight:500;color:var(--muted)}
.planchip{display:inline-block;margin-top:2px;font-size:12px;background:color-mix(in srgb,var(--g2) 12%,var(--bg));padding:2px 9px;border-radius:999px}
.app.m .segs{display:grid;grid-template-columns:repeat(4,1fr);margin:0;padding:0}.app.m .segs button{padding:8px 4px;font-size:13px}
.chips .ci{display:inline-flex;align-items:center;gap:6px}.chips .ci svg{width:15px;height:15px}
.tile.sm{width:28px;height:28px;border-radius:9px}.tile.sm .ico{width:16px;height:16px}
.tile.lg{width:54px;height:54px;border-radius:17px}.tile.lg .ico{width:30px;height:30px}
.ico{width:21px;height:21px;flex:none;display:block}
.ico.in{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.2em;margin-right:3px}
:root[data-theme="dark"] .tile,:root[data-theme="dark"] .ict{color:color-mix(in srgb,var(--c) 62%,#fff)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tile,:root:not([data-theme="light"]) .ict{color:color-mix(in srgb,var(--c) 62%,#fff)}}

/* Categorias em grade */
.cats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat3{background:var(--card);border-radius:20px;padding:12px;box-shadow:var(--shadow);border:0;text-align:left;min-width:0}
.cat3 .n{font-size:12.5px;margin-top:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cat3 .p{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:6px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--g2)}
.bar i.near{background:var(--warn)!important}.bar i.over{background:var(--bad)!important}
.catrows{display:flex;flex-direction:column;gap:13px}
.catrow .t{display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:8px}
.catrow .t>span:first-child{display:flex;align-items:center;gap:9px;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.catrow .t>span:last-child{color:var(--muted);font-size:13px;white-space:nowrap}

/* Listas */
.list{background:var(--card);border-radius:22px;padding:4px 14px;box-shadow:var(--shadow)}
.list.flat{box-shadow:none;padding:0;background:none}
.it{display:flex;align-items:center;gap:12px;padding:11px 0;border:0;background:none;width:100%;text-align:left;color:inherit}
.it+.it{border-top:1px solid var(--line)}
.it .t{flex:1;min-width:0}.it .t b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}.it .t>span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .t>span .chip{display:inline-block;padding:1px 7px;font-size:10.5px;margin-left:2px}
.it .m{font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.it .m small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.it .m.in{color:var(--good)}
.it.new{animation:slideIn .6s cubic-bezier(.2,.9,.3,1.2)}
@keyframes slideIn{from{opacity:0;transform:translateY(-14px) scale(.96);background:var(--amber-soft)}to{opacity:1;transform:none}}
.pill{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--muted);margin-left:5px;vertical-align:1px;letter-spacing:.02em}
.pill.new{background:var(--amber-soft);color:var(--amber-ink)}
.chip{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
.chip.up,.chip.bad{background:color-mix(in srgb, var(--bad) 14%, var(--card));color:var(--bad)}
.chip.down,.chip.ok{background:color-mix(in srgb, var(--good) 15%, var(--card));color:var(--good)}
.chip.flat{background:color-mix(in srgb, var(--t-flat) 14%, var(--card));color:var(--t-flat)}
.chip.warn{background:color-mix(in srgb, var(--warn) 18%, var(--card));color:var(--warn)}
.chip.mut{background:var(--soft);color:var(--muted)}
.mini{border:0;background:var(--g2);color:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;white-space:nowrap}
.mini.ghost{background:var(--soft);color:var(--link)}

/* Dias agrupados */
.dayh{display:flex;justify-content:space-between;align-items:baseline;padding:14px 2px 4px;font-size:13px;color:var(--muted);font-weight:700}
.dayh b{color:var(--fg);font-size:14px}
.dbar{display:flex;height:5px;border-radius:5px;overflow:hidden;gap:2px;margin:2px 2px 4px}
.dbar b{display:block;height:100%;border-radius:3px}

/* Botões */
.btn{border:0;border-radius:15px;padding:12px 16px;font-weight:700;font-size:14.5px;background:linear-gradient(150deg,var(--g2),var(--g1));color:#fff;box-shadow:0 6px 16px rgba(11,94,72,.25)}
.btn.ghost{background:var(--soft);color:var(--link);box-shadow:none}
.btn.block{width:100%}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:12px}

/* Barra inferior com + central */
.nav{position:absolute;left:0;right:0;bottom:0;height:84px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:flex-start;justify-content:space-around;padding:10px 10px;border-top:1px solid var(--line);z-index:3}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font:500 11px var(--body);color:var(--muted);width:58px;padding:4px 0;border-radius:14px}
.nav button[aria-current="page"]{color:var(--link);font-weight:700}
.nav svg{width:23px;height:23px}
.nav button.fab{width:60px;height:60px;border-radius:50%;background:linear-gradient(150deg,var(--g2),var(--g1));margin-top:-30px;box-shadow:0 10px 22px rgba(11,94,72,.4);color:#fff;position:relative;overflow:hidden;justify-content:center}
.nav button.fab svg{width:28px;height:28px}

/* Menu lateral (computador) */
.side{background:var(--bg);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.brand{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:9px;padding:0 8px 16px}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(150deg,#13805F,var(--g1));color:#fff;display:grid;place-items:center;flex:none}
.side .addbtn{margin:0 4px 12px}
.side button.nv{border:0;background:none;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;font-weight:600;font-size:14px;color:var(--muted);text-align:left;position:relative}
.side button.nv svg{width:20px;height:20px}
.side button.nv[aria-current="page"]{background:color-mix(in srgb,var(--g2) 12%,var(--bg));color:var(--link)}
.side button.nv .dot{margin-left:auto;min-width:18px;height:18px;border-radius:9px;background:#F0563A;color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
.side .foot{margin-top:auto;font-size:12.5px;color:var(--muted);padding:12px;border-radius:14px;background:var(--soft)}
.side .foot .bar{background:var(--line2)}
.dtop{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}

/* Segmentos e filtros */
.segs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px 2px}
.app.d .segs{margin:0;padding:0;flex-wrap:wrap}
.segs::-webkit-scrollbar{display:none}
.segs button{flex:none;border:0;background:var(--soft);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:700;color:var(--muted)}
.app.d .segs button{background:var(--card)}
.segs button[aria-pressed="true"],.app.d .segs button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:-6px -18px 0;padding:0 18px 2px}
.app.d .filters{margin:-6px 0 0;padding:0;flex-wrap:wrap}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;border:1px solid var(--line2);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--g2);border-color:var(--g2);color:#fff}
.fband{display:flex;align-items:center;gap:12px;padding:12px 14px;background:color-mix(in srgb,var(--g2) 9%,var(--card))}
.fband .t{flex:1;min-width:0}.fband .t b{display:block;font-size:14.5px}.fband .t span{font-size:12.5px;color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.toolbar .acts{display:flex;gap:8px}

/* Metas e anéis */
.ring{width:var(--rs,48px);height:var(--rs,48px);flex:none;position:relative}
.ring svg{transform:rotate(-90deg);display:block}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800}
.goalrow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:13px 14px;box-shadow:var(--shadow);border:0;width:100%;text-align:left}
.goalrow .t{flex:1;min-width:0}.goalrow .t b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.goalrow .t span{font-size:12.5px;color:var(--muted)}
.goal{display:flex;flex-direction:column;gap:10px}
.goal .gh{display:flex;align-items:center;gap:12px}
.goal .gh div.t{flex:1;min-width:0}
.goal .gh .t b{font-size:16px;display:block}
.goal .gh small{color:var(--muted);font-size:12.5px}
.goal p{margin:0;font-size:14px}
.goal .acts{display:flex;gap:8px;align-items:center;justify-content:space-between}
.cuts{display:flex;flex-direction:column;gap:7px}
.cut{display:flex;align-items:center;gap:9px;font-size:13.5px}
.cut > span:not(.tile){flex:1}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.legend2{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend2 i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.form{display:flex;flex-direction:column;gap:9px}
.form input,.form select,.sheet input{border:1.5px solid var(--line2);background:var(--soft);color:var(--fg);border-radius:14px;padding:11px 13px;font:inherit;width:100%;min-width:0;outline:none}
.form input:focus,.sheet input:focus{border-color:var(--g2)}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form .row2>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.fl{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-bottom:-4px}

/* Tendências */
.trend{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:center;padding:9px 0}
.trend+.trend{border-top:1px solid var(--line)}
.trend .nm{font-weight:600;font-size:14px;min-width:0}
.trend .nm small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.trend .chip{margin-top:3px}
.mbars .bb{display:flex;align-items:flex-end;gap:3px;height:34px}
.mbars b{width:8px;border-radius:3px 3px 1px 1px;display:block}
.mbars .mo{display:flex;gap:3px;margin-top:3px}
.mbars .mo i{width:8px;font-style:normal;font-size:8.5px;color:var(--muted);text-align:center}

/* Contas */
.sumbox{display:flex;align-items:center;gap:14px}
.sumbox .t{flex:1;min-width:0}
.sumbox .big{font-family:var(--body);font-weight:700;font-size:24px;letter-spacing:-.03em;line-height:1.1}
.paybtn{border:2px solid var(--line2);background:var(--card);color:var(--muted);border-radius:50%;width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;flex:none}
.paybtn svg{width:18px;height:18px;opacity:.55}
.paybtn:hover{border-color:var(--g2);color:var(--g2)}
.paybtn:hover svg{opacity:1}
.paydone{width:36px;height:36px;border-radius:50%;background:var(--good);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.paydone svg{width:18px;height:18px}
.paydone.fresh{animation:popin .45s cubic-bezier(.2,.9,.3,1.4)}
@keyframes popin{from{transform:scale(.4);opacity:0}}
.paid{color:var(--good);font-size:12.5px;font-weight:800;display:inline-flex;align-items:center;gap:4px}
.pbar{display:flex;gap:3px;margin-top:6px}
.pbar i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.pbar i.on{background:var(--g2)}

/* Cartões de crédito */
.ccs{display:grid;gap:14px}
.app.d .ccs{grid-template-columns:1fr 1fr}
.cc{border-radius:24px;padding:18px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(140deg,var(--c1),var(--c2));box-shadow:0 14px 28px color-mix(in srgb,var(--c2) 35%,transparent);min-height:170px;display:flex;flex-direction:column}
.cc:after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.12)}
.cc .h{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16px;position:relative;z-index:1}
.cc .h span{font-size:12px;font-weight:600;opacity:.85}
.cc .lb{font-size:12px;opacity:.85;margin-top:auto}
.cc .vv{font-family:var(--body);font-size:24px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cc .meter{margin-top:8px;background:rgba(255,255,255,.25)}
.cc .meter i{background:#fff}
.cc .ft{display:flex;justify-content:space-between;font-size:12px;opacity:.9;margin-top:8px}

/* Avisos */
.nt{display:flex;gap:12px;align-items:flex-start;padding:14px 0}
.nt+.nt{border-top:1px solid var(--line)}
.nt .ic{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none;font-size:19px}
.nt .t{flex:1;min-width:0}
.nt .t b{display:block;font-size:14.5px}
.nt .t p{margin:2px 0 8px;font-size:13.5px;color:var(--muted);white-space:pre-line}
.nt .t .acts{display:flex;gap:8px;flex-wrap:wrap}
.nt time{font-size:11.5px;color:var(--muted);white-space:nowrap}

/* Casal */
.split{display:flex;height:14px;border-radius:8px;overflow:hidden;margin:4px 0 10px;gap:3px}
.split b{display:block;border-radius:6px}
.legend{display:flex;justify-content:space-between;font-size:13.5px;gap:10px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:7px}
.invite{display:flex;gap:8px;align-items:center;background:var(--soft);border:1.5px dashed var(--line2);border-radius:14px;padding:8px 8px 8px 12px;font-size:13px}
.invite code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace, Menlo, monospace;font-size:12.5px}
.profiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prof{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:6px 0}
.prof b{font-size:16px;margin-top:8px}
.prof small{color:var(--muted);font-size:12.5px}
.prof .st{font-size:12.5px;color:var(--muted);font-style:italic}
.prof .gs{margin-top:8px;font-weight:800;font-size:16px}

/* Seguro */
.seguro{background:linear-gradient(160deg, color-mix(in srgb,var(--g2) 12%,var(--card)), var(--card) 65%);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--g2) 50%,transparent)}
.seguro h4{font-family:var(--body);font-weight:700;font-size:17px;margin:0 0 6px;letter-spacing:-.015em}
.seguro p{margin:0 0 12px;font-size:14px}
.seguro .fine{font-size:12px;color:var(--muted);margin-top:10px}
.locked{background:var(--soft);box-shadow:none;color:var(--muted);font-size:13.5px}
.locked .bar{background:var(--line2)}

/* Planos */
.plans{display:grid;gap:14px}
.app.d .plans{grid-template-columns:repeat(4,1fr);align-items:start}
.plan{position:relative;display:flex;flex-direction:column;gap:6px}
.plan.best{box-shadow:inset 0 0 0 2px var(--g2),var(--shadow)}
.plan .tag{position:absolute;top:-10px;right:14px;background:var(--amber);color:#2A1C02;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;letter-spacing:.03em}
.plan .ex{font-size:12.5px;font-weight:700;color:var(--g2);margin-top:-4px}
.tseg.cobr{max-width:360px;margin-bottom:14px}.tseg.cobr em{font-style:normal;font-size:11px;font-weight:800;color:#2A1C02;background:var(--amber);border-radius:999px;padding:1px 7px;margin-left:4px}
.plan .nm{font-weight:700;font-size:15px}
.plan .pr{font-family:var(--body);font-size:23px;font-weight:700;letter-spacing:-.025em}
.plan .pr small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
.plan ul{margin:4px 0 8px;padding-left:18px;font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}

/* Chat estilo WhatsApp */
.chatwrap{display:flex;flex-direction:column;min-height:0;height:100%}
.app.d .chatwrap{border-radius:22px;overflow:hidden;height:660px;box-shadow:var(--shadow)}
.chathead{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.chathead .logo{width:38px;height:38px;border-radius:50%}
.chathead b{display:block;font-size:15px}
.chathead small{color:#1FA855;font-size:12px;font-weight:700}
.chathead .bk{border:0;background:none;font-size:26px;line-height:1;padding:0 4px 0 0;color:var(--link)}
.msgs{flex:1;overflow-y:auto;background:var(--chat-bg);padding:14px 12px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.msg{max-width:84%;padding:8px 11px 6px;border-radius:12px;font-size:14px;box-shadow:0 1px 0 rgba(0,0,0,.06);white-space:pre-line}
.msg.in{background:var(--bubble-in);align-self:flex-start;border-top-left-radius:4px}
.msg.out{background:var(--bubble-out);align-self:flex-end;border-top-right-radius:4px}
.msg time{display:block;text-align:right;font-size:10.5px;color:var(--muted);margin-top:2px}
.msg .att{display:flex;align-items:center;gap:8px;font-weight:600}
.msg .att i{width:34px;height:34px;border-radius:8px;background:color-mix(in srgb,var(--g2) 15%,transparent);display:grid;place-items:center;font-style:normal;color:var(--link);font-size:12px}
.msg .mb{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.msg .mb button{border:0;background:color-mix(in srgb,#1FA855 12%,var(--bubble-in));color:#128C4A;border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:700}
:root[data-theme="dark"] .msg .mb button{color:#5FD68E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .msg .mb button{color:#5FD68E}}
.msg.new{animation:pop .22s ease-out}
@keyframes pop{from{transform:translateY(6px) scale(.97);opacity:.3}}
.typing{align-self:flex-start;background:var(--bubble-in);border-radius:12px;padding:10px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}
.day{align-self:center;font-size:11.5px;background:var(--card);color:var(--muted);padding:3px 10px;border-radius:8px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 12px;background:var(--card);border-top:1px solid var(--line);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line2);background:var(--soft);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600;white-space:nowrap}
.composer{display:flex;gap:8px;padding:8px 10px 12px;background:var(--card)}
.composer input{flex:1;min-width:0;border:1.5px solid var(--line2);background:var(--soft);color:var(--fg);border-radius:999px;padding:10px 14px;font:inherit;font-size:14px;outline:none}
.composer button{width:44px;height:44px;border-radius:50%;border:0;background:#1FA855;color:#fff;display:grid;place-items:center;flex:none}
.app.d .chatlayout{display:grid;grid-template-columns:minmax(0,430px) 1fr;gap:22px;align-items:start}
.howto ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:14px}

/* Folhas (bottom sheet) */
.scrim{position:absolute;inset:0;background:rgba(5,12,10,.42);z-index:20;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--bg);color:var(--fg);border-radius:28px 28px 0 0;max-height:88%;overflow-y:auto;padding:10px 18px 24px;display:flex;flex-direction:column;gap:12px;animation:up .38s cubic-bezier(.2,.9,.25,1.05) both}
@keyframes up{from{transform:translateY(105%)}}
.sheet.d{left:50%;top:50%;bottom:auto;width:min(480px,92%);border-radius:24px;max-height:90%;padding-top:18px;transform:translate(-50%,-50%);animation:pop2 .28s cubic-bezier(.2,.9,.25,1.1) both}
@keyframes pop2{from{opacity:0;transform:translate(-50%,-46%) scale(.96)}}
.closing .sheet{animation:down .22s ease-in both}.closing .sheet.d{animation:fadeo .18s both}.closing .scrim{animation:fadeo .22s both}
@keyframes down{to{transform:translateY(105%)}}@keyframes fadeo{to{opacity:0}}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line2);margin:0 auto 2px;flex:none}
.sheet.d .grab{display:none}
.sh-head{display:flex;align-items:center;gap:8px}
.sh-head h3{flex:1;margin:0;font-family:var(--body);font-size:19px;letter-spacing:-.01em;font-weight:700}
.sh-head button{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;color:var(--muted);flex:none}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;min-width:0;font-size:16px;padding:14px}
.send{width:54px;border:0;border-radius:16px;background:linear-gradient(150deg,var(--g2),var(--g1));color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.sug{display:flex;gap:8px;flex-wrap:wrap}
.sug button{border:0;background:var(--soft);color:var(--fg);border-radius:999px;padding:9px 13px;font:500 13.5px var(--body)}
.sug .lbl{width:100%;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-top:4px}
.picks{display:flex;flex-direction:column}
.pick{display:flex;align-items:center;gap:12px;border:0;background:none;padding:9px 2px;text-align:left;font-weight:600;font-size:15px}
.pick+.pick{border-top:1px solid var(--line)}
.pick > span:not(.tile){flex:1}
.pick .ok{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800}
.pick .chev{color:var(--muted);font-size:18px}
.preview{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--soft)}
.preview>b,.preview>div>b{font-size:16px}
.emos{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emos button{aspect-ratio:1;border:1.5px solid var(--line2);background:var(--soft);border-radius:11px;line-height:1;padding:0;max-width:100%;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.emos button[aria-pressed="true"]{border:2px solid var(--g2);background:color-mix(in srgb,var(--g2) 12%,var(--bg))}
.cores{display:flex;flex-wrap:wrap;gap:8px}
.cores button{width:32px;height:32px;border-radius:50%;border:3px solid var(--bg)}
.cores button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.optlist{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;border:0;background:var(--soft);border-radius:16px;padding:13px 14px;text-align:left;width:100%}
.opt .t{flex:1}.opt b{display:block;font-size:14.5px}.opt span{font-size:12.5px;color:var(--muted)}
.opt .ic{width:40px;height:40px;border-radius:13px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}

/* Aviso rápido (toast) */
.toast{position:absolute;left:14px;right:14px;top:14px;z-index:30;background:#101816;color:#fff;border-radius:20px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 14px 30px rgba(0,0,0,.25);pointer-events:none}
.app.d ~ .toast,.browser .toast{left:auto;right:22px;width:360px}
.toast.fresh{animation:drop .45s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes drop{from{transform:translateY(-140%)}}
.toast .ck{width:40px;height:40px;border-radius:50%;background:rgba(242,165,22,.16);display:flex;align-items:center;justify-content:center;flex:none}
.toast .ck path{stroke-dasharray:24}
.toast.fresh .ck path{stroke-dashoffset:24;animation:draw .5s .2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.toast b{display:block;font-size:14.5px}.toast span{font-size:12.5px;opacity:.78;display:block}
.backbtn{align-self:flex-start;border:0;background:var(--soft);color:var(--link);font-weight:700;font-size:13.5px;padding:7px 14px 7px 10px;border-radius:999px;margin-bottom:-6px}
canvas.cf{position:absolute;inset:0;pointer-events:none;z-index:40}

@media (max-width:720px){
  body{padding-block:10px 20px}
  .phone{width:100%;padding:0;background:none;box-shadow:none;border-radius:24px;height:calc(100vh - 150px);min-height:600px}

}
@media (prefers-reduced-motion: reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

function countUp(el,from,to){const t0=performance.now(),d=RM()?0:900;function f(t){const k=d?Math.min(1,(t-t0)/d):1,e=1-Math.pow(1-k,3),v=from+(to-from)*e;const [i,c]=fmt(Math.abs(v)).split(',');el.innerHTML=(v<0?'- ':'')+'R$ '+i+'<small>,'+c+'</small>';if(k<1&&el.isConnected)requestAnimationFrame(f)}requestAnimationFrame(f)}

function guessCat(txt){const l=txt.toLowerCase();for(const c of CATS) if(c.kw.some(k=>l.includes(k))||l.includes(c.nome.toLowerCase())) return c.id;return 'out'}
const hasWord=(l,k)=>new RegExp('(^|[^a-z0-9à-ü])'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?=$|[^a-z0-9à-ü])').test(l);
function findCat(l){return CATS.find(c=>c.id!=='out'&&(l.includes(c.nome.toLowerCase())||c.kw.some(k=>k.length>=3&&hasWord(l,k))))}
function payOf(l){if(/nubank|\bnu\b|roxinho/.test(l))return 'nu';if(/ita[uú]/.test(l))return 'it';if(/cr[eé]dito|cart[aã]o/.test(l))return 'nu';if(/d[eé]bito/.test(l))return 'deb';if(/dinheiro/.test(l))return 'din';return 'pix'}
function parseVal(s){const m=s.match(/(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)\s*(mil|k)?/i);if(!m)return null;let v=/^\d{1,3}(\.\d{3})+/.test(m[1])?parseFloat(m[1].replace(/\./g,'').replace(',','.')):parseFloat(m[1].replace(',','.'));if(m[2])v*=1000;return {v,raw:m[0]}}
const clean=(t,...rm)=>{let d=t;rm.forEach(r=>d=d.replace(r,' '));d=d.replace(/^\s*(?:paguei|gastei|comprei)\s+/i,' ').replace(/(?:\b(?:no|na|pelo|pela|com|em|de)\s+)?(?:cart[aã]o(?:\s+de\s+cr[eé]dito)?|cr[eé]dito|d[eé]bito|pix|nubank|ita[uú]|dinheiro)(?=\s|$|[,.!?])/gi,' ').replace(/(?:^|\s)(?:reais|r\$|rs)(?=\s|$)/gi,' ').replace(/\s+/g,' ').trim().replace(/\s+(?:de|do|da|no|na|em|com|a|o)$/i,'').replace(/^(?:de|do|da|no|na|em|com|a|o)\s+/i,'');return cap(d||'Gasto')};
function addMov(o){const m={id:++seq,dia:TODAY,who:'a',pag:'pix',novo:true,...o};if(m.tipo!=='in'&&m.cat==='out'&&!m.fixa)m.rev=1;S.mov.push(m);S.used++;S.fresh=m.id;return m}
function limitNote(){return S.used>=S.limit?`\n\nVocê chegou aos ${S.limit} lançamentos do plano grátis deste mês. Para continuar anotando sem limite, é só conhecer os planos.`:''}
function interpret(text){
 const l=text.toLowerCase().trim();
 const ask=/\?$/.test(l)||/^(quanto|quais|qual|posso|como|tenho|cad[eê]|quando)\b/.test(l);
 // Metas
 if(/\b(quero|juntar|guardar|economizar|meta)\b/.test(l)&&!/quanto/.test(l)){const g=parseGoal(text);if(g){S.metas.unshift(g);const f=forecast().list.find(x=>x.g.id===g.id);let r=`Que bom objetivo! Para juntar ${brl0(g.valor)} até ${mlabel(g.alvo)}, vocês precisam guardar cerca de ${brl0(f.need)} por mês.\n`;r+=f.ok?`Pelos gastos dos últimos 3 meses, cabe no orçamento, e ainda sobram uns ${brl0(f.livreDepois)} por mês.`:`Hoje sobram uns ${brl0(f.usa)} por mês para essa meta. Nesse ritmo, vocês chegam lá em ${f.pace?mlabel(f.pace):'um prazo ainda indefinido'}. Preparei algumas sugestões para cumprir o prazo.`;return {r,btn:'metas',toast:['Meta criada',`${g.nome}, ${brl0(g.valor)}`]}}}
 // Perguntas
 if(ask||/^resumo/.test(l)){
  if(/resumo/.test(l))return {r:resumoSemana()};
  if(/posso gastar|d[aá] pra gastar|cabe/.test(l)){const pv=parseVal(l);const meta=forecast().list[0];const mm=meta?meta.usa:0;const margem=sobraPrev()-mm;const x=pv?pv.v:0;
   const base=`Livre para gastar até o fim do mês: *${brl0(margem)}*. Já descontando as contas que ainda vencem (${brl0(fixasAbertas())})${meta?` e os ${brl0(mm)} da meta "${meta.g.nome}"`:''}.`;
   if(!x)return {r:base};
   if(x<=margem*.4)return {r:`Pode, sim! ${base} Gastando ${brl0(x)}, ainda ficam ${brl0(margem-x)}.`};
   if(x<=margem)return {r:`Dá, mas fica mais apertado. ${base} Gastando ${brl0(x)}, ficam ${brl0(margem-x)} para o resto do mês.`};
   return {r:`Hoje eu seguraria. ${base} Um gasto de ${brl0(x)} passaria disso e mexeria na meta.`}}
  if(/fatura|cart[aã]o/.test(l)){const id=/ita[uú]/.test(l)?'it':'nu',c=card(id),fat=contas().find(x=>x.id==='fat-'+id);return {r:`A fatura de novembro do ${c.nome} está em ${brl(fatura(id))} e fecha dia ${c.fecha}.\nA de outubro, de ${brl(c.ant)}, ${fat.paid?'já está paga':`vence dia ${c.vence}`}.`+(S.parc.filter(p=>p.pag===id).length?`\nParcelas nesse cartão: ${S.parc.filter(p=>p.pag===id).map(p=>`${p.desc} ${p.atual}/${p.n}`).join(', ')}.`:'')}}
  const fc0=findCat(l);

 else if(D.th){S.th=D.th;if(S.th==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',S.th);render()}
 else if(D.day){S.day=+D.day;render()}
 else if(D.tab){S.sheet=null;if(b.closest('.nav'))goTab(D.tab);else go({tab:D.tab})}
 else if(D.filt){S.filt=D.filt;render()}
 else if(D.sayGo){go({tab:'chat'});say(D.sayGo)}
 else if(D.say!==undefined){say(D.say)}
 else if('photo' in D){S.chat.push({k:'out',t:'cupom_farmacia.jpg',att:'IMG',h:nowH()});S.typing=true;render();setTimeout(()=>{S.typing=false;const m=addMov({desc:'Farmácia do Bairro',cat:'sau',v:87.4,pag:'deb'});S.chat.push({k:'in',t:`Recebi o comprovante da Farmácia do Bairro, de 04/11, pago no débito.\nTánotado! R$ 87,40 em Saúde.${limitNote()}`,h:nowH(),gid:m.id});render()},900)}
 else if('audio' in D){S.chat.push({k:'out',t:'Áudio 0:04',att:'▶',h:nowH()});S.typing=true;render();setTimeout(()=>{S.typing=false;const res=interpret('paguei a luz 180 no pix');S.chat.push({k:'in',t:'Ouvi seu áudio: "paguei cento e oitenta de luz".\n'+res.r,h:nowH(),gid:res.gid});render()},900)}
 else if(D.act==='copy'){const t='tanotado.app.br/c/athos-marina-7Q2';try{navigator.clipboard.writeText(t).then(()=>flash('Convite copiado'),()=>flash('Selecione o link para copiar'))}catch(_){flash('Selecione o link para copiar')}}
 else if(D.act==='export'){S.sheet={mode:'export'};render()}
 else if(D.act==='seguro'){S.seguroOk=true;render()}
 else if(D.act==='plan'){flash(D.nm==='Grátis'?'Você já está no plano grátis':'Plano '+D.nm,'No app de verdade, o pagamento entraria aqui')}
});
document.addEventListener('submit',e=>{
 e.preventDefault();
 if(e.target.id==='metaForm'){const num=id=>parseFloat((document.getElementById(id).value||'').replace(/\./g,'').replace(',','.'))||0;
  const nome=document.getElementById('gNome').value.trim(),valor=num('gValor');if(!nome||!valor){flash('Preencha o objetivo e o valor');return}
  ['gNome','gValor','gGuard'].forEach(id=>document.getElementById(id).value='');
  S.metas.unshift({id:++seq,nome,ic:'🎯',valor,guardado:num('gGuard'),alvo:+document.getElementById('gAlvo').value});S.anim=true;flash('Previsão calculada',nome);return}
 if(e.target.id==='composer'){const i=document.getElementById('chatIn');const v=i.value;i.value='';say(v);setTimeout(()=>document.getElementById('chatIn')?.focus({preventScroll:true}),0)}
 if(e.target.id==='addForm'){const i=document.getElementById('addIn');const v=i.value;i.value='';quickAdd(v)}
});
document.addEventListener('input',e=>{if(e.target.id==='catName'&&S.sheet){S.sheet.name=e.target.value;const p=document.getElementById('pvName');if(p)p.textContent=e.target.value||'Nome da categoria'}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet)closeSheet();if(e.key==='Enter'&&e.target.id==='catName'){e.preventDefault();saveCat()}if(e.key==='Enter'&&(e.target.id==='addVal'||e.target.id==='addDesc')){e.preventDefault();saveForm()}});
window.addEventListener('resize',()=>{clearTimeout(render.r);render.r=setTimeout(render,150)});
render();
</script>
