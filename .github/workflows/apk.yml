name: Gerar APK de teste

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependências
        run: npm install
      - name: Criar projeto Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Tanotado-teste.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Tanotado-teste
          path: Tanotado-teste.apk
      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: teste-${{ github.run_number }}
          name: Tánotado teste ${{ github.run_number }}
          body: "APK de teste para Android. Baixe o arquivo Tanotado-teste.apk abaixo e abra no celular."
          files: Tanotado-teste.apk
          prerelease: true
